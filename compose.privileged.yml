# compose.privileged.yml - overlay adding the container-escape scenarios.
#
# Adds a disposable Docker-in-Docker sandbox (docker-sandbox) and points
# ops-console's Docker client at it via DOCKER_HOST, plus the extra Linux
# capability run-privileged-container-abuse.sh uses. Kept as a
# separate file from compose.yml so the base setup stays minimal; add it
# with -f when you want these scenarios too.
#
# WARNING: docker-sandbox is `privileged: true` and its Docker API
# (tcp 2375) has no authentication. A privileged container shares the host
# kernel and can see host devices, so it is NOT a security boundary: a
# determined process inside it can escape to the host (mounting host block
# devices, cgroup v1 release_agent, kernel modules). The scenarios stay
# inside docker-sandbox by design, but the only real isolation is the
# disposable VM you run this on. Never run this overlay on a workstation or
# shared host. Nothing is published to the host, and northline-net is
# `internal: true`, which limits (does not remove) the blast radius.
#
# Usage:
#   docker compose -f compose.yml -f compose.privileged.yml up -d
#   docker compose -f compose.yml -f compose.privileged.yml exec ops-console \
#       bash playbooks/install-container-tools.sh
#   docker compose -f compose.yml -f compose.privileged.yml exec ops-console \
#       bash playbooks/run-docker-socket-escape.sh
#   docker compose -f compose.yml -f compose.privileged.yml down

services:
  ops-console:
    cap_add:
      - SYS_PTRACE  # for the nsenter/ptrace attempts in run-privileged-container-abuse.sh
    environment:
      - DOCKER_HOST=tcp://docker-sandbox:2375
    depends_on:
      - docker-sandbox

  # Disposable nested Docker daemon. privileged:true is required for
  # Docker-in-Docker but is NOT isolated from the host kernel (see warning
  # above). No volume is declared, so `docker compose down -v` resets it.
  # setup-net gives it egress to pull alpine:3.20 during setup only.
  docker-sandbox:
    image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
    container_name: northline-docker-sandbox
    hostname: docker-sandbox
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    networks:
      - northline-net
      - setup-net
